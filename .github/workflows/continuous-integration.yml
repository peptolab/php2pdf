name: "Continuous Integration"

on:
  push:
  pull_request:

jobs:
  qa:
    uses: peptolab/peptolab-qa-tools/.github/workflows/continuous-integration.yml@0.1.x
    secrets: inherit
    with:
      php-versions: '["8.3", "8.4", "8.5"]'
      run-integration: true
      apt-packages: "qpdf poppler-utils ghostscript librsvg2-bin fonts-dejavu-core"
      enable-codecov: false
      enable-infection: false

  integration-macos:
    name: "Integration on macOS (CoreGraphics)"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PDF tooling
        run: brew install qpdf poppler ghostscript librsvg

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Integration tests
        run: composer test-integration

  without-intl:
    name: "Tests without ext-intl"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP without intl
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: :intl
          coverage: none

      - name: Check intl is not loaded
        run: "! php -m | grep -qix intl"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Fallback tests
        run: vendor/bin/phpunit --group no-intl --fail-on-skipped
