name: "Continuous Integration"

on:
  push:
  pull_request:

jobs:
  qa:
    uses: peptolab/peptolab-qa-tools/.github/workflows/continuous-integration.yml@0.1.x
    secrets: inherit
    with:
      php-versions: '["8.3", "8.4", "8.5"]'
      run-integration: true
      apt-packages: "qpdf poppler-utils ghostscript librsvg2-bin fonts-dejavu-core"
      enable-codecov: false
      enable-infection: false

  integration-macos:
    name: "Integration on macOS (CoreGraphics)"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PDF tooling
        run: brew install qpdf poppler ghostscript librsvg

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Integration tests
        run: composer test-integration

      - name: Upload rendered output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-output-macos
          path: test/output
          retention-days: 7

  without-intl:
    name: "Tests without ext-intl"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP without intl
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: :intl
          coverage: none

      - name: Check intl is not loaded
        run: "! php -m | grep -qix intl"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Fallback tests
        run: vendor/bin/phpunit --group no-intl --fail-on-skipped

  pdfa:
    name: "PDF/A validation (veraPDF)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PDF tooling
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install veraPDF
        run: |
          curl -sSL -o /tmp/verapdf.zip https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-installer
          cat > /tmp/verapdf-install.xml <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>$HOME/verapdf</installpath></com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar /tmp/verapdf-installer/*/verapdf-izpack-installer-*.jar /tmp/verapdf-install.xml
          echo "$HOME/verapdf" >> "$GITHUB_PATH"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, intl, openssl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Validate PDF/A output
        run: vendor/bin/phpunit --group pdfa --fail-on-skipped
