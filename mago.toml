#:schema https://mago.carthage.software/1.43.0/schema.json
# The peptolab/peptolab-qa-tools base configuration, written out in full rather than extended: its
# analyzer excludes test/, and an extending file can add to that list but not remove from it.
# Keep the shared settings in step with the base when it changes; this project's own settings
# follow each section's shared ones.
version = "1"
php-version = "8.3.0"

[source]
paths = ["src", "test"]
includes = ["vendor"]

[formatter]
preset = "default"
print-width = 120
tab-width = 4
use-tabs = false
# Keep `(new Foo())->bar()`: CI checks the format for each PHP version, and the bare form needs 8.4.
parentheses-around-new-in-member-access = true
preserve-breaking-member-access-chain = true
preserve-breaking-member-access-chain-first-method-on-same-line = true
preserve-breaking-argument-list = true
preserve-breaking-array-like = true
preserve-breaking-parameter-list = true
preserve-breaking-attribute-list = true
preserve-breaking-conditional-expression = true
preserve-breaking-condition-expression = true
preserve-redundant-logical-binary-expression-parentheses = true
preserve-breaking-binary-expression = true
space-after-logical-not-unary-prefix-operator = true
always-break-named-arguments-list = true
align-assignment-like = true
sort-class-methods = true

[linter]
minimum-fail-level = "Help"
integrations = ["laminas", "phpunit"]

[linter.rules]
literal-named-argument = { enabled = true }
valid-docblock = { enabled = true }
no-negated-ternary = { enabled = true }
no-short-bool-cast = { enabled = true }
no-inline = { enabled = true }
no-array-accumulation-in-loop = { enabled = true }
no-literal-namespace-string = { enabled = true }
no-parameter-shadowing = { enabled = true }
no-side-effects-with-declarations = { enabled = true }
prefer-array-spread = { enabled = true }
prefer-explode-over-preg-split = { enabled = true }
prefer-first-class-callable = { check-functions = true }
prefer-test-attribute = { enabled = true }
require-namespace = { enabled = true }
prefer-pre-increment = { enabled = true }
prefer-self-return-type = { enabled = true }
sorted-integer-keys = { enabled = true }
yoda-conditions = { enabled = true }
file-name = { enabled = true }
array-style = { level = "Help" }
block-statement = { level = "Help" }
braced-string-interpolation = { enabled = true, level = "Help" }
no-alias-function = { level = "Help" }
no-php-tag-terminator = { level = "Help" }
no-trailing-space = { level = "Help" }
string-style = { enabled = true, level = "Help" }
ambiguous-constant-access = { enabled = true }
ambiguous-function-call = { enabled = true }
class-name = { psr = true }
function-name = { camel = true, exclude = ["src/functions/*"] }
interface-name = { psr = true }
method-name = { enabled = true, camel = true }
no-fully-qualified-global-class-like = { enabled = true }
no-fully-qualified-global-constant = { enabled = true }
no-fully-qualified-global-function = { enabled = true }
property-name = { enabled = true }
trait-name = { psr = true }
variable-name = { enabled = true, camel = true, either = false }
no-iterator-to-array-in-foreach = { enabled = true }
no-duplicate-match-arm = { level = "Help" }
no-empty-comment = { level = "Help" }
no-empty-loop = { level = "Help" }
no-is-null = { enabled = true, level = "Help" }
no-null-property-init = { enabled = true }
no-redundant-else = { enabled = true }
disallowed-type-instantiation = { enabled = true }
no-debug-symbols = { level = "Help" }
no-assign-in-argument = { enabled = true }
no-dead-store = { enabled = true }
no-redundant-variable = { enabled = true }
no-unused-closure-capture = { enabled = true }
no-unused-global = { enabled = true }
no-unused-static = { enabled = true }
switch-continue-to-break = { enabled = true }
invalid-open-tag = { level = "Help" }

# Size and complexity limits for the whole library. Each rule lists two kinds of exception:
#
# - Honest ones, which stay: binary format readers that follow a format's grammar branch by
#   branch, geometry formulas, and value objects that are sheets of named settings.
# - A ratchet: classes the restructuring phases split up. Remove a file from its list when it
#   passes, and never add one to make new code pass.
too-many-methods = { threshold = 30, exclude = [
    # Test classes group many cases.
    "test/",
    # Honest: the drawing vocabulary (paths, painting, state, colour, text), each method a line or
    # two delegating to the content stream, shapes, paint and text painter.
    "src/Canvas/Canvas.php",
    # Ratchet: the face and its instance split; table accessors go.
    "src/Font/OpenType/OpenTypeFont.php",
    # Ratchet: a cascade and a typed computed style.
    "src/Svg/Style.php",
] }
too-many-properties = { threshold = 12, exclude = [
    # Ratchet, as above.
    "src/Font/OpenType/OpenTypeFont.php",
    # Ratchet: content and layout state separate.
    "src/Table/Table.php",
] }
cyclomatic-complexity = { threshold = 80, method-threshold = 15, exclude = [
    # Honest: a default for every setting a style leaves unset.
    "src/Text/Style/ParagraphFormat.php",
    # Honest: format readers, branch by branch.
    "src/Font/FontInfo.php",
    "src/Font/OpenType/Cff/Cff2CharStrings.php",
    "src/Font/OpenType/Cff/Cff2Reader.php",
    "src/Image/PngDecoder.php",
    "src/Svg/PathParser.php",
    # Ratchet: the glyph buffer and shaping plan replace the tuple pipeline.
    "src/Font/ArabicFallback.php",
    "src/Font/OpenType/Gpos.php",
    "src/Font/OpenType/GposAttachment.php",
    "src/Font/OpenType/Gsub.php",
    "src/Font/OpenTypeShaper.php",
    # Ratchet: SVG paint resolution, markers and the cascade.
    "src/Svg/MarkerBuilder.php",
    "src/Svg/MarkerVertices.php",
    "src/Svg/PaintServers.php",
    "src/Svg/Style.php",
    "src/Svg/StyleSheet.php",
    # Ratchet: table planning and layout.
    "src/Table/Layout.php",
    "src/Table/Planner.php",
    # Ratchet: the text engine's breaker, assembler, itemiser stages and layout result.
    "src/Text/Flow/GreedyBreaker.php",
    "src/Text/Flow/LineAssembler.php",
    "src/Text/Flow/ParagraphComposer.php",
] }
excessive-parameter-list = { threshold = 8, constructor-threshold = 16, exclude = [
    # Honest: sheets of named, optional settings, and the same sheets resolved.
    "src/Font/OpenType/Metrics.php",
    "src/Text/Style/ParagraphFormat.php",
    "src/Text/Style/TextStyle.php",
] }
halstead = { volume-threshold = 2500, difficulty-threshold = 30, effort-threshold = 10000, exclude = [
    # Honest: the formulas of curves, arcs and charstrings.
    "src/Font/OpenType/Cff/Cff2CharStrings.php",
    "src/Geometry/Path.php",
    "src/Svg/PathParser.php",
    # Ratchet, as above.
    "src/Font/OpenType/Gpos.php",
    "src/Font/OpenType/GposAttachment.php",
    "src/Table/Planner.php",
    # Tests build whole documents in one method.
    "test/",
] }
kan-defect = { threshold = 4.5, exclude = [
    # Ratchet, as above.
    "src/Font/OpenType/Gsub.php",
    "src/Font/OpenTypeShaper.php",
    "src/Text/Flow/GreedyBreaker.php",
    "src/Text/Flow/LineAssembler.php",
] }
# The HarfBuzz adapter's purpose is to call the library through FFI; nothing else may.
no-ffi = { exclude = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] }

[analyzer]
# Tests are analysed too, so they keep up with the signatures they call.
excludes = ["test/asset", "test/output"]
plugins = ["psl", "psr-container"]
find-unused-definitions = true
find-unused-expressions = true
find-overly-wide-return-types = true
analyze-dead-code = true
memoize-properties = true
check-throws = true
check-missing-override = true
find-unused-parameters = true
strict-list-index-checks = true
strict-array-index-existence = true
allow-array-truthy-operand = false
no-boolean-literal-comparison = true
check-missing-type-hints = true
check-arrow-function-missing-type-hints = true
register-super-globals = false
check-property-initialization = true
check-use-statements = true
check-name-casing = true
enforce-class-finality = true
require-api-or-internal = true
class-initializers = [
    "PHPUnit\\Framework\\TestCase::setUp",
]
# Reading files is checked: ParseException and IoException must be declared with @throws, so
# callers see which calls read input that may be broken or missing. Bad arguments, misuse of an
# object's state, and conformance and layout failures are unchecked: they are bugs in the calling
# code, or failures a document as a whole handles at its boundary.
unchecked-exceptions = [
    "Error",
    "LogicException",
    "Laminas\\Validator\\Exception\\RuntimeException",
    "PHPUnit\\Framework\\Exception",
    "PHPUnit\\Framework\\MockObject\\Exception",
    "PHPUnit\\Event\\NoPreviousThrowableException",
    "Php2Pdf\\Exception\\InvalidArgumentException",
    "Php2Pdf\\Exception\\StateException",
    "Php2Pdf\\Exception\\ConformanceException",
    "Php2Pdf\\Exception\\LayoutException",
]
unchecked-exception-classes = ["Php2Pdf\\Exception\\PdfException"]
# The object model and the import layer handle arbitrary PDF objects, which are `mixed` by nature.
ignore = [
    # A test lets what it calls throw: the exception fails the test, so tests declare none.
    { code = "unhandled-thrown-type", in = ["test/"] },
    { code = "mixed-assignment", in = ["src/Import/", "src/Core/Object/", "src/Core/Serializer.php", "src/Core/Filter/FilterChain.php"] },
    # Values coming back from C through FFI are untyped to the analyser.
    { code = "mixed-assignment", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "mixed-array-access", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "mixed-property-access", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "mixed-property-type-coercion", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "mixed-return-statement", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "non-existent-property", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "null-operand", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "impossible-condition", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "invalid-array-access", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "null-argument", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "string-member-selector", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "possibly-null-array-access", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "possibly-undefined-int-array-index", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "invalid-array-index", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "no-value", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "non-existent-method", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
]
