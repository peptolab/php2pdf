extends = "vendor/php-db/phpdb-qa-tools/mago.toml"
php-version = "8.3.0"

[source]
paths = ["src", "test"]
includes = ["vendor"]

[linter.rules]
# Size and complexity limits for the whole library. Each rule lists two kinds of exception:
#
# - Honest ones, which stay: binary format readers that follow a format's grammar branch by
#   branch, geometry formulas, and value objects that are sheets of named settings.
# - A ratchet: classes the restructuring phases split up. Remove a file from its list when it
#   passes, and never add one to make new code pass.
too-many-methods = { threshold = 30, exclude = [
    # Ratchet: split into a content stream, graphics state, paint and text painters.
    "src/Canvas/Canvas.php",
    # Ratchet: catalog contributors and an asset loader take its jobs.
    "src/Document/Document.php",
    # Ratchet: the face and its instance split; table accessors go.
    "src/Font/OpenType/OpenTypeFont.php",
    # Ratchet: a cascade and a typed computed style.
    "src/Svg/Style.php",
] }
too-many-properties = { threshold = 12, exclude = [
    # Ratchet, as above.
    "src/Document/Document.php",
    "src/Font/OpenType/OpenTypeFont.php",
    # Ratchet: content and layout state separate.
    "src/Table/Table.php",
] }
cyclomatic-complexity = { threshold = 80, method-threshold = 15, exclude = [
    # Honest: format readers, branch by branch.
    "src/Font/FontInfo.php",
    "src/Font/OpenType/Cff/Cff2CharStrings.php",
    "src/Font/OpenType/Cff/Cff2Reader.php",
    "src/Image/PngDecoder.php",
    "src/Svg/PathParser.php",
    # Ratchet: the glyph buffer and shaping plan replace the tuple pipeline.
    "src/Font/ArabicFallback.php",
    "src/Font/OpenType/Gpos.php",
    "src/Font/OpenType/GposAttachment.php",
    "src/Font/OpenType/Gsub.php",
    "src/Font/OpenTypeShaper.php",
    # Ratchet: the page tree moves to a class of its own.
    "src/Import/PdfReader.php",
    # Ratchet: SVG paint resolution, markers and the cascade.
    "src/Svg/MarkerBuilder.php",
    "src/Svg/MarkerVertices.php",
    "src/Svg/PaintServers.php",
    "src/Svg/Style.php",
    "src/Svg/StyleSheet.php",
    # Ratchet: table planning and layout.
    "src/Table/Layout.php",
    "src/Table/Planner.php",
    # Ratchet: the text engine's breaker, assembler, itemiser stages and layout result.
    "src/Text/Flow/Itemiser.php",
    "src/Text/Flow/Layout.php",
    "src/Text/Flow/LineBreaker.php",
    "src/Text/Flow/ParagraphComposer.php",
] }
excessive-parameter-list = { threshold = 8, constructor-threshold = 16, exclude = [
    # Honest: sheets of named, optional settings.
    "src/Font/OpenType/Metrics.php",
    "src/Text/Style/TextStyle.php",
    # Ratchet: a raster and its soft mask separate.
    "src/Image/ImageData.php",
] }
halstead = { volume-threshold = 2500, difficulty-threshold = 30, effort-threshold = 10000, exclude = [
    # Honest: the formulas of curves, arcs and charstrings.
    "src/Font/OpenType/Cff/Cff2CharStrings.php",
    "src/Svg/PathData.php",
    "src/Svg/PathParser.php",
    # Ratchet, as above.
    "src/Font/OpenType/Gpos.php",
    "src/Font/OpenType/GposAttachment.php",
    "src/Table/Planner.php",
    # Tests build whole documents in one method.
    "test/",
] }
kan-defect = { threshold = 4.5, exclude = [
    # Ratchet, as above.
    "src/Font/OpenType/Gsub.php",
    "src/Font/OpenTypeShaper.php",
    "src/Import/PdfReader.php",
    "src/Text/Flow/Itemiser.php",
    "src/Text/Flow/LineBreaker.php",
    "src/Text/Textflow.php",
] }
# The HarfBuzz adapter's purpose is to call the library through FFI; nothing else may.
no-ffi = { exclude = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] }

[analyzer]
# Reading files is checked: ParseException and IoException must be declared with @throws, so
# callers see which calls read input that may be broken or missing. Bad arguments, misuse of an
# object's state, and conformance and layout failures are unchecked: they are bugs in the calling
# code, or failures a document as a whole handles at its boundary.
unchecked-exceptions = [
    "Error",
    "LogicException",
    "Php2Pdf\\Exception\\InvalidArgumentException",
    "Php2Pdf\\Exception\\StateException",
    "Php2Pdf\\Exception\\ConformanceException",
    "Php2Pdf\\Exception\\LayoutException",
]
unchecked-exception-classes = ["Php2Pdf\\Exception\\PdfException"]
# The object model and the import layer handle arbitrary PDF objects, which are `mixed` by nature.
ignore = [
    { code = "mixed-assignment", in = ["src/Import/", "src/Core/Object/", "src/Core/Serializer.php", "src/Core/Filter/FilterChain.php"] },
    # Values coming back from C through FFI are untyped to the analyser.
    { code = "mixed-assignment", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "mixed-array-access", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "mixed-property-access", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "mixed-property-type-coercion", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "mixed-return-statement", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "non-existent-property", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "null-operand", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "impossible-condition", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "invalid-array-access", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "null-argument", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "string-member-selector", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "possibly-null-array-access", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "possibly-undefined-int-array-index", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "invalid-array-index", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
    { code = "no-value", in = ["src/Font/HarfBuzz/HarfBuzzFfi.php"] },
]
