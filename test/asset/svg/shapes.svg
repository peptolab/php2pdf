<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200mm" height="140mm" viewBox="0 0 400 280">
  <!-- Basic shapes, strokes, dashes, transforms, gradients, clip paths, opacity, use/symbol. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e88e5"/>
      <stop offset="1" stop-color="#e3f2fd"/>
    </linearGradient>
    <linearGradient id="diag" x1="0%" y1="0%" x2="100%" y2="100%" spreadMethod="pad">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="50%" stop-color="#ffee58"/>
      <stop offset="100%" stop-color="#66bb6a"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.4" cy="0.35" r="0.6" fx="0.3" fy="0.3">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8e24aa"/>
    </radialGradient>
    <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="250" y1="200" x2="330" y2="200" gradientTransform="rotate(20 290 230)">
      <stop offset="0" stop-color="#00695c"/>
      <stop offset="1" stop-color="#b2dfdb"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="80" cy="200" r="40"/>
    </clipPath>
    <clipPath id="frame" clipPathUnits="objectBoundingBox">
      <rect x="0.1" y="0.1" width="0.8" height="0.8" rx="0.1"/>
    </clipPath>
    <symbol id="star" viewBox="0 0 20 20">
      <polygon points="10,1 12.6,7 19,7.5 14,12 15.5,19 10,15.5 4.5,19 6,12 1,7.5 7.4,7" fill="#fdd835" stroke="#f57f17" stroke-width="0.8" stroke-linejoin="round"/>
    </symbol>
    <g id="pin">
      <path d="M0,-18 C-6,-18 -9,-13 -9,-8 C-9,-2 0,8 0,8 C0,8 9,-2 9,-8 C9,-13 6,-18 0,-18 Z" fill="#d32f2f"/>
      <circle cx="0" cy="-8" r="3.5" fill="#fff"/>
    </g>
  </defs>

  <rect width="400" height="280" fill="#fafafa"/>
  <rect x="10" y="10" width="180" height="90" fill="url(#sky)" stroke="#0d47a1" stroke-width="1.5"/>
  <rect x="200" y="10" width="190" height="90" rx="14" fill="url(#diag)"/>
  <circle cx="60" cy="55" r="30" fill="url(#ball)"/>
  <ellipse cx="150" cy="55" rx="34" ry="20" fill="none" stroke="#283593" stroke-width="3" stroke-dasharray="8 4" stroke-linecap="round"/>

  <g transform="translate(240 40) rotate(-15)">
    <rect x="0" y="0" width="60" height="30" fill="#ffffff" fill-opacity="0.6" stroke="#424242"/>
    <line x1="0" y1="0" x2="60" y2="30" stroke="#212121" stroke-width="2"/>
  </g>
  <polyline points="310,25 325,70 340,30 355,80 370,35" fill="none" stroke="#6d4c41" stroke-width="2.5" stroke-linejoin="bevel"/>

  <path d="M20 160 q 30 -50 60 0 t 60 0 t 60 0" fill="none" stroke="#00838f" stroke-width="2"/>
  <path d="M250 120 a 30 30 0 0 1 60 0 a 30 30 0 0 1 -60 0 z M 265 120 a 15 15 0 1 0 30 0 a 15 15 0 1 0 -30 0 z"
        fill="#ffb300" fill-rule="evenodd" stroke="#e65100" stroke-width="1"/>
  <path d="M330 110 l 50 0 l -25 45 z" fill="#4caf50"/>

  <image x="20" y="170" width="120" height="80" clip-path="url(#round)" preserveAspectRatio="xMidYMid slice"
         xlink:href="data:image/png;base64,"/>

  <g opacity="0.5">
    <rect x="150" y="170" width="70" height="70" fill="#1565c0"/>
    <rect x="185" y="200" width="70" height="60" fill="#c62828"/>
  </g>
  <rect x="250" y="190" width="80" height="60" fill="url(#user)" clip-path="url(#frame)"/>

  <use xlink:href="#star" x="340" y="180" width="40" height="40"/>
  <use href="#star" x="350" y="230" width="20" height="20" opacity="0.4"/>
  <use href="#pin" transform="translate(300 260) scale(1.2)"/>
  <use href="#pin" x="20" y="268" transform="scale(0.8)"/>
</svg>
